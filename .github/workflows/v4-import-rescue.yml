name: Import verified V4 portrait rescue batch
on:
  push:
    paths:
      - '.github/workflows/v4-import-rescue.yml'
      - 'new-149/rescue_manifest.json'
      - 'new-149/import_rescue.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-reviewed-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Import only identified candidate portraits
        run: python new-149/import_rescue.py
      - name: Commit success reports and acquired images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/README.md new-149/assets/rescue new-149/rescue_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified portrait rescue results"
            git push
          fi
