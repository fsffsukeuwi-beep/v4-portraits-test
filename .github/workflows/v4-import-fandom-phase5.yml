name: Candidate portraits V4 phase 5
on:
  push:
    paths:
      - '.github/workflows/v4-import-fandom-phase5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python new-149/import_fandom_phase5.py
      - name: Commit unassigned image candidates and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/wiki new-149/wiki_report_phase5.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive phase 5 character image candidates without assigning unchecked portraits"
            git push
          fi
