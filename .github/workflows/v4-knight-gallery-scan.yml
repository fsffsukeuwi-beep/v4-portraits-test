name: Inspect Knight Run wiki portrait candidate names
on:
  push:
    paths:
      - '.github/workflows/v4-knight-gallery-scan.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python new-149/scan_knight_gallery.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/knight_gallery_scan.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Knight Run gallery filename candidates without assigning images"
            git push
          fi
