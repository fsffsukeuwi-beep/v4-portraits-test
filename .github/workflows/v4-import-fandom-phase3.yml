name: Import V4 new-149 Fandom portraits phase 3
on:
  push:
    paths:
      - '.github/workflows/v4-import-fandom-phase3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python new-149/import_fandom_phase3.py
      - name: Commit imported portraits and result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/wiki new-149/wiki_report_phase3.json
          if ! git diff --cached --quiet; then
            git commit -m "Add phase 3 character image source candidates"
            git push
          fi
