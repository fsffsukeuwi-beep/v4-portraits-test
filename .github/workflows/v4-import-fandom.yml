name: Import V4 new-149 Fandom character portraits
on:
  push:
    paths:
      - '.github/workflows/v4-import-fandom.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-wiki-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python new-149/import_fandom.py
      - name: Commit identified wiki image candidates and result log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/wiki new-149/wiki_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Import exact character wiki lead image candidates"
            git push
          fi
