name: Candidate portraits V4 phase 7
on:
  push:
    paths:
      - '.github/workflows/v4-import-fandom-phase7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python new-149/import_fandom_phase7.py
      - name: Commit unassigned candidates and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/wiki new-149/wiki_report_phase7.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive phase 7 candidate portraits for visual review"
            git push
          fi
