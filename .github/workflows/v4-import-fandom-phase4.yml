name: Candidate portraits V4 Knight Run phase 4
on:
  push:
    paths:
      - '.github/workflows/v4-import-fandom-phase4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Download 10 exact-page Knight Run image candidates
        run: python new-149/import_fandom_phase4.py
      - name: Archive candidate files and inspection metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/wiki new-149/wiki_report_phase4.json
          if ! git diff --cached --quiet; then
            git commit -m "Collect phase 4 Knight Run portrait image candidates"
            git push
          fi
