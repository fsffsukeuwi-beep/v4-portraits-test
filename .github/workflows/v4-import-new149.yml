name: Import V4 new-149 portrait sources
on:
  push:
    paths:
      - '.github/workflows/v4-import-new149.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Download and verify linked image files
        run: python new-149/import_assets.py
      - name: Commit only imported portraits and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/imported new-149/import_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive available V4 external portrait assets and record failures"
            git push
          fi
