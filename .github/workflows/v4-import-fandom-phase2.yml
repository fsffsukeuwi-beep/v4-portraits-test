name: Import V4 new-149 Fandom portraits phase 2
on:
  push:
    paths:
      - '.github/workflows/v4-import-fandom-phase2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Download individual wiki profile images
        run: python new-149/import_fandom_phase2.py
      - name: Commit downloaded portraits and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/wiki new-149/wiki_report_phase2.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive more named-character portrait candidates"
            git push
          fi
