name: V4 SC-GOH48 candidate portrait collection
on:
  push:
    paths:
      - '.github/workflows/v4-sc-goh48-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v4-sc-goh48-candidates
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python -u new-sc-goh48/collect_candidates.py
      - name: Record candidates and evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-sc-goh48
          if ! git diff --cached --quiet; then
            git commit -m "Collect unapproved SC-GOH48 portrait candidates and evidence"
            git push
          fi
