name: Download late V4 image candidates
on:
  push:
    paths:
      - '.github/workflows/v4-late-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python new-149/import_late_candidates.py
      - name: Store image candidates for visual verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/late new-149/late_candidates_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Save late Knight Run and Tiger Brother image candidates"
            git push
          fi
