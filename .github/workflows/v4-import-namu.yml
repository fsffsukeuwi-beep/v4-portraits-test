name: Archive V4 verified-name Korean wiki image candidates
on:
  push:
    paths:
      - '.github/workflows/v4-import-namu.yml'
      - 'new-149/import_namu_candidates.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python new-149/import_namu_candidates.py
      - name: Save candidate image bytes and checksums without altering README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/namu new-149/namu_import_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive named Korean wiki image candidates for visual review"
            git push
          fi
