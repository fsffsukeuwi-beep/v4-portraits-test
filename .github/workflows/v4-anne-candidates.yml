name: Archive Knight Run Anne solo-image candidates
on:
  push:
    paths:
      - '.github/workflows/v4-anne-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python new-149/import_knight_candidates.py
      - name: Save unassigned image candidates for later selection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-149/assets/knight new-149/knight_image_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Save Knight Run Anne portraits and Jenny Leny Kamal image-name search results"
            git push
          fi
